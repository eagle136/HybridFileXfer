version=多轨快传(HybirdFileXfer) v3.3
# 符合gnu规范的帮助
help_pages=Usage: HybirdFileXfer [OPTION]...\n\
  \t使用多 I/O 通道（如 USB 和 WiFi）加速从手机到电脑的文件传输。\n\n\
  Mandatory arguments:\n\
  \t-c, --connect=ADDRESS\t指定连接方式:\n\
  \t\t\t\t\t\t\tadb      = 使用 ADB 连接\n\
  \t\t\t\t\t\t\tIP_ADDR  = 使用网络直连 (如 192.168.1.114)\n\
  \t-s, --device=ID\t\t\t指定 USB 设备 ID\n\
  \t-d, --dir=DIRECTORY\t\t设置电脑接收目录 (默认: /)\n\n\
  Other options:\n\
  \t-h, --help\t\t\t\t显示此帮助信息\n\
  \t-v, --version\t\t\t显示版本信息\n\n\
  Examples:\n\tHybirdFileXfer -c adb\n\
  \tHybirdFileXfer -c adb -s 2dd16815 -d C:\\Users\\Downloads\n\
  \tHybirdFileXfer -c 192.168.1.114 -d D:\\Transfer\\Files\n\
  \tHybirdFileXfer（不带 -c）\t打开窗口，点“开始扫描”发现局域网设备\n\n\
  GUI 说明:\n\
  \t不带 -c：只打开窗口，不自动扫描、不自动连接\n\
  \t-c IP：打开窗口并直连该 IP\n\
  \t-c adb：先 adb forward，再优先把主信道切到可达 LAN；\n\
  \t         无其它网口可达时回退 127.0.0.1，拔线会中断\n\n\
  Report bugs to: <https://github.com/eagle136/HybridFileXfer/issues>

